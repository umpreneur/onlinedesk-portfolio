<!doctype html>
<html lang="nl" class="no-js">
<head>
<base href="/onlinedesk-portfolio/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina niet gevonden · Noor de Vries</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f3ed">
  <!-- Absolute paden (/assets/...): deze pagina kan op elke URL getoond worden -->
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css">
  <script src="./assets/site.js" defer></script>

<body data-page="404">

  <header class="site-header" id="top">
    <div class="wrap">
      <a href="./" class="logo">Noor de Vries<span>.</span></a>
      <div class="header-right">
        <div class="lang" role="group" aria-label="Taal / Language">
          <button data-lang="nl" lang="nl" aria-label="Nederlands">NL</button>
          <button data-lang="en" lang="en" aria-label="English">EN</button>
        </div>
      </div>
    </div>

  <main class="not-found">
    <div class="wrap">
      <div class="code">404</div>
      <h1 data-i18n="nf_title">Deze pagina bestaat niet</h1>
      <p data-i18n="nf_text">Misschien is de pagina verplaatst of klopt de link niet.</p>
      <a href="./" class="btn" data-i18n="nf_btn">Terug naar home</a>
    </div>
